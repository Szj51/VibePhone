; VibePhone · ESP32-S3 USB-HID 按键固件
;
; 目标硬件：优信电子 YD-ESP32-23 V1.3
;           ESP32-S3-WROOM 模组，N16R8（16MB Flash + 8MB Octal PSRAM）
;
; ⚠️ 两个关键点，改配置前务必先读：
;
; 1) esp32-s3-devkitc-1 的板级定义会强制加上 -DARDUINO_USB_MODE=1，
;    而该值会启用"硬件 CDC/JTAG"并【禁用 TinyUSB 栈】——USBHIDKeyboard 依赖
;    TinyUSB，结果是键盘压根不会枚举出来。
;    所以必须先用 build_unflags 把板级的 =1 移除，再用 build_flags 设成 0。
;    两者的先后顺序有关系，不能只写 build_flags（那会产生重定义，结果不确定）。
;
; 2) 有【两个 USB-C 口】，必须用标着 USB/OTG 的那个：
;      COM      口 = 板载 USB-串口芯片，只能烧录和看日志
;      USB/OTG  口 = S3 原生 USB（GPIO19/20），HID 只能走这个口
;
; 引脚注意：N16R8 的 8MB Octal PSRAM 占用 GPIO33~GPIO37，切勿用作他用。

[env:yd-esp32-23]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino

; --- N16R8 的 16MB Flash ---
; 板级定义 (boards/esp32-s3-devkitc-1.json) 里写死了两处 8MB，必须都覆盖，
; 否则只有一半 flash 可用，而且分区表是 8MB 的：
;     "upload": { "flash_size": "8MB", "maximum_size": 8388608 }
;     "build":  { "arduino": { "partitions": "default_8MB.csv" } }
; 覆盖后 app 分区 3.19MB → 6.25MB，SPIFFS 1.5MB → 3.38MB。
board_upload.flash_size  = 16MB
board_upload.maximum_size = 16777216
board_build.flash_size   = 16MB
board_build.arduino.partitions = default_16MB.csv

; 用原生 USB 口做 HID 键盘
build_unflags =
    -DARDUINO_USB_MODE=1
build_flags =
    -DARDUINO_USB_MODE=0        ; 0 = 使用 TinyUSB 栈（USB HID 必需）
    -DARDUINO_USB_CDC_ON_BOOT=1 ; Serial = USB CDC（复合设备的串口那一半）
                                ; Serial0 = UART0（仍走 COM 口，专做调试日志）
                                ;
                                ; 于是 USB/OTG 一个口同时提供【键盘 + 串口】，
                                ; 而 COM 口的调试日志不受 USB 状态影响，两边互不干扰。

; ---- 库依赖 ----
; 显示屏用 Adafruit 这套，理由是引脚配置全在我们自己代码里（config.h），
; 不需要像 TFT_eSPI 那样去改库自带的 User_Setup.h —— 对交付友好得多。
; 240x240 的状态显示，性能完全够。
lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0
    adafruit/Adafruit GFX Library@^1.12.6
    adafruit/Adafruit BusIO@^1.17.4

; 烧录走的 COM 口（FTDI）。
; 注意：接上屏幕后用 921600 会报「The chip stopped responding」——
; 屏幕挂上后 USB 侧负载和走线电容都变了，高速烧录不稳。
; 460800 实测稳定；再不行就用 115200（慢但最稳）。
upload_speed = 115200

monitor_speed = 115200
monitor_filters = time
